<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Intelligence Daily - 欢迎</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0a0f; color: #f1f1f6;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .container { text-align: center; max-width: 600px; padding: 40px; }
    .logo { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 32px; margin-bottom: 10px; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { font-size: 16px; color: #8888a0; margin-bottom: 30px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 14px;
      cursor: pointer; transition: all .2s; margin: 8px;
    }
    .btn:hover { background: #818cf8; transform: translateY(-2px); }
    .btn.secondary { background: #2a2a3a; border: 1px solid #3a3a4a; }
    .btn.secondary:hover { background: #3a3a4a; }
    .status { margin-top: 20px; padding: 12px; background: #1a1a24; border-radius: 8px; font-size: 12px; color: #8888a0; display: none; }
    .status.active { display: block; }
    .status.success { color: #4ade80; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🚀</div>
    <h1>AI Intelligence Daily</h1>
    <p class="subtitle">全球资讯速递 · 桌面应用</p>
    <div>
      <button class="btn" id="fetchBtn">📡 获取今日资讯</button>
      <button class="btn secondary" id="loadBtn">📄 加载已有报告</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const fetchBtn = document.getElementById('fetchBtn');
    const loadBtn = document.getElementById('loadBtn');
    const status = document.getElementById('status');

    async function runFetch() {
      status.className = 'status active';
      status.textContent = '正在获取全球资讯...';
      fetchBtn.disabled = true;
      
      try {
        const result = await window.electronAPI.runFetch();
        status.className = 'status active success';
        status.textContent = '✓ 数据获取成功！正在生成报告...';
        
        await window.electronAPI.generateReport();
        status.textContent = '✓ 报告生成成功！正在加载...';
        
        setTimeout(async () => {
          await window.electronAPI.loadReport();
        }, 1000);
      } catch (error) {
        status.className = 'status active error';
        status.textContent = '✗ 错误: ' + error.error;
      }
      
      fetchBtn.disabled = false;
    }

    async function loadReport() {
      try {
        const result = await window.electronAPI.loadReport();
        if (result.success) {
          status.className = 'status active success';
          status.textContent = '✓ 已加载报告';
        } else {
          status.className = 'status active error';
          status.textContent = '✗ ' + result.message;
        }
      } catch (error) {
        status.className = 'status active error';
        status.textContent = '✗ 错误: ' + error.error;
      }
    }

    fetchBtn.addEventListener('click', runFetch);
    loadBtn.addEventListener('click', loadReport);
  </script>
</body>
</html>
